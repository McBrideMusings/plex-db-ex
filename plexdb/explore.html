<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tag explorer — plexdb</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6b66; --line: #e3e2dd;
    --accent: #2f5fb3; --accent-ink: #ffffff; --noise: #b3432f; --noise-bg: #fbeeea;
    --chip: #eef1f7; --row-hover: #f2f4f8; --selected: #e4ebf8; --centre: #c77d12; --edge: #b9bdc6;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --panel: #1f1f1d; --ink: #e9e8e3; --muted: #9a998f; --line: #34332f;
      --accent: #7ea4ea; --accent-ink: #10131a; --noise: #ec8a74; --noise-bg: #3a231d;
      --chip: #2a2f3a; --row-hover: #262a31; --selected: #2b3547; --centre: #f0b04a; --edge: #4a4f5a;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  header { padding: 14px 20px 10px; border-bottom: 1px solid var(--line); background: var(--panel);
           display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; }
  h1 { font-size: 16px; margin: 0; font-weight: 650; }
  .stats { color: var(--muted); font-variant-numeric: tabular-nums; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
  .seg button { border: 0; background: transparent; color: var(--ink); padding: 5px 12px; font: inherit; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .controls { padding: 10px 20px; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
              border-bottom: 1px solid var(--line); }
  .controls label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); }
  input[type="search"], input[type="number"] { font: inherit; color: var(--ink); background: var(--panel);
              border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
  input[type="search"] { width: 16em; }
  input[type="number"] { width: 5em; }
  .noisebar { margin-left: auto; display: inline-flex; gap: 8px; align-items: center; }
  .noisebar strong { color: var(--noise); font-variant-numeric: tabular-nums; }
  button.plain { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                 border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button.plain:hover { border-color: var(--accent); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 0; align-items: start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } aside { position: static !important; max-height: none !important; border-left: 0 !important; border-top: 1px solid var(--line); } }
  .tablewrap { overflow-x: auto; padding: 0 20px 24px; }
  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .cellid { color: var(--muted); font-size: 11px; }
  th { position: sticky; top: 0; background: var(--bg); font-weight: 600; color: var(--muted); white-space: nowrap; z-index: 1; }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--ink); }
  th .arrow { display: inline-block; width: 1em; }
  td.num, th.num { text-align: right; }
  tbody tr { cursor: pointer; }
  tbody tr:hover { background: var(--row-hover); }
  tbody tr.selected { background: var(--selected); }
  tbody tr.noise td.tag { color: var(--noise); text-decoration: line-through; text-decoration-thickness: 1px; }
  td.tag { font-weight: 550; }
  .chip { display: inline-block; background: var(--chip); border-radius: 5px; padding: 1px 7px; margin: 1px 4px 1px 0;
          cursor: pointer; white-space: nowrap; }
  .chip:hover { outline: 1px solid var(--accent); }
  .chip .n { color: var(--muted); margin-left: 4px; }
  .more { padding: 12px 0; color: var(--muted); display: flex; gap: 12px; align-items: center; }
  aside { position: sticky; top: 0; max-height: 100vh; overflow-y: auto; border-left: 1px solid var(--line);
          background: var(--panel); padding: 16px 18px; min-height: 60vh; }
  aside h2 { font-size: 17px; margin: 0 0 4px; overflow-wrap: anywhere; }
  aside .sub { color: var(--muted); margin-bottom: 12px; font-variant-numeric: tabular-nums; }
  aside h4 { margin: 12px 0 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  aside ol { margin: 0; padding-left: 0; list-style: none; }
  aside li { padding: 5px 0; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; gap: 10px; }
  aside li .kw { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .empty { color: var(--muted); }
  textarea#copyout { display: block; width: calc(100% - 40px); height: 4.5em; margin: 10px 20px 0;
                     font: 12px ui-monospace, Menlo, monospace; color: var(--ink); background: var(--panel);
                     border: 1px solid var(--accent); border-radius: 6px; padding: 6px 8px; }
  [hidden] { display: none !important; }
  #map, #network { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #map.dragging, #network.dragging { cursor: grabbing; }
  /* The default map standing in while another computes: blurred and faded on a tinted ground,
     because its dots are already pale and opacity alone does not show. */
  #map.dim { filter: blur(2px) opacity(0.45); cursor: progress; }
  #mapbox:has(#map.dim) { background: var(--chip); }
  .vpctl { position: absolute; left: 10px; bottom: 10px; display: flex; gap: 4px; z-index: 6; }
  .vpctl button { font: inherit; min-width: 30px; height: 30px; padding: 0 8px; cursor: pointer; color: var(--ink);
                  background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .vpctl button:hover { border-color: var(--accent); }
  .searchbox { position: relative; }
  .searchbox input[type="search"] { width: 20em; max-width: 100%; }
  .sugg { position: absolute; z-index: 9; left: 0; top: calc(100% + 2px); min-width: 20em; max-height: 60vh; overflow: auto;
          margin: 0; padding: 4px 0; list-style: none; color: var(--ink); }
  .sugg .grp { padding: 4px 10px 2px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .sugg li.opt { padding: 4px 10px; cursor: pointer; display: flex; justify-content: space-between; gap: 12px; }
  .sugg li.opt.on, .sugg li.opt:hover { background: var(--selected); }
  .sugg li .n { color: var(--muted); white-space: nowrap; }
  .tcard { position: absolute; width: 290px; max-width: calc(100% - 20px); max-height: calc(100% - 20px); overflow: auto;
           background: var(--panel); color: var(--ink); border: 1px solid var(--line); border-radius: 8px;
           box-shadow: 0 6px 24px rgba(0,0,0,.2); padding: 12px; font-size: 13px; line-height: 1.4; }
  .tcard.hover { pointer-events: none; z-index: 3; width: max-content; max-width: 260px; padding: 6px 10px; }
  .tcard.hover h3 { margin: 0; font-size: 13px; font-weight: 600; }
  .tcard.pinned { right: 10px; top: 10px; z-index: 2; }
  .tcard .close { position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; padding: 0; cursor: pointer; font: inherit;
                  color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .tcard .close:hover { border-color: var(--accent); }
  .tcard .top { display: flex; gap: 10px; }
  .poster { flex: none; width: 68px; height: 102px; border-radius: 5px; background: var(--chip); color: var(--muted);
            display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 650;
            border: 1px dashed var(--line); position: relative; overflow: hidden; }
  .poster img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .poster.small { width: 32px; height: 48px; font-size: 13px; border-radius: 4px; }
  .trow, .cellrow { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .tcard h3 { margin: 0 24px 2px 0; font-size: 15px; overflow-wrap: anywhere; }
  .tcard .meta { color: var(--muted); }
  .tcard .desc { margin: 8px 0; color: var(--muted); font-style: italic; }
  .tcard h4 { margin: 8px 0 3px; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .tcard .chip { cursor: default; }
  .tcard.pinned .chip { cursor: pointer; }
  .tcard ol { margin: 0; padding: 0; list-style: none; }
  .tcard li { padding: 2px 0; display: flex; gap: 8px; }
  .tcard li .rk { color: var(--muted); min-width: 2.2em; font-variant-numeric: tabular-nums; }
  .tcard li.link { cursor: pointer; }
  .tcard li.link:hover span:last-child { color: var(--accent); }
  .tcard li.off { color: var(--muted); }
  aside .chips { margin-top: 4px; }
  aside .chip.noise { color: var(--noise); text-decoration: line-through; }
  .err { color: var(--noise); padding: 12px 20px; }
  /* Graph and Map: the viewport fills everything under the header and the page never scrolls.
     Every control floats over it as a panel; the space between panels belongs to the canvas. */
  html:has(body.shell) { overflow: hidden; }
  body.shell { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  body.shell header { flex: none; }
  #stage { position: relative; }
  body.shell #stage { flex: 1; min-height: 0; }
  body.shell main { position: absolute; inset: 0; display: block; }
  .graphwrap { position: absolute; inset: 0; }
  #graphbox, #mapbox { position: absolute; inset: 0; background: var(--panel); overflow: hidden; }
  .ov, body.shell .controls, body.shell aside#detail, .ovnote, .sugg {
    background: color-mix(in srgb, var(--panel) 90%, transparent); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
  .ovtl { position: absolute; top: 10px; left: 10px; z-index: 8; display: flex; gap: 8px; align-items: center; max-width: calc(100% - 20px); }
  .ovtl label { display: inline-flex; gap: 6px; align-items: center; padding: 4px 8px; color: var(--muted); }
  .ovtl select { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 6px; }
  .ovtl output { font-variant-numeric: tabular-nums; min-width: 2em; text-align: right; }
  .ovnote { position: absolute; left: 150px; bottom: 10px; z-index: 1; max-width: min(560px, calc(100% - 170px));
            padding: 4px 9px; font-size: 12px; line-height: 1.35; color: var(--muted); pointer-events: none; }
  .ovnote:empty { display: none; }
  #ctltoggle { display: none; }
  .ctlbody { display: contents; }
  body.shell .controls { position: absolute; z-index: 5; top: 56px; left: 10px; padding: 6px 8px; max-width: calc(100% - 20px);
                         flex-direction: column; align-items: flex-start; gap: 8px; }
  body.shell #ctltoggle { display: inline-block; }
  body.shell .controls .ctlbody { display: none; }
  body.shell .controls.open .ctlbody { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
  body.shell .noisebar { margin-left: 0; flex-wrap: wrap; }
  body.shell #copyout { position: absolute; z-index: 9; left: 10px; bottom: 56px; width: min(420px, calc(100% - 20px)); margin: 0; }
  body.shell #error { position: absolute; z-index: 9; top: 56px; left: 10px; max-width: calc(100% - 20px); padding: 8px 12px;
                      background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
  /* The right-hand column holds the tag panel and the pinned title card, stacked. */
  #rightcol { display: contents; }
  body.shell #rightcol { display: flex; flex-direction: column; align-items: stretch; gap: 8px; position: absolute; z-index: 4;
                         top: 10px; right: 10px; bottom: 10px; width: 340px; pointer-events: none; }
  body.shell #rightcol > * { pointer-events: auto; flex: 0 1 auto; min-height: 0; overflow: auto; }
  body.shell aside#detail { position: static !important; max-height: none !important; min-height: 0; padding: 12px 14px;
                            border: 1px solid var(--line) !important; }
  body.shell aside#detail:has(> p.empty) { display: none; }
  body.shell .tcard.pinned { position: relative; top: auto; right: auto; width: auto; max-width: none; max-height: none; }
  body:not([data-view="map"]) .tcard { display: none; }
  @media (max-width: 600px) {
    body.shell #rightcol { top: auto; left: 8px; right: 8px; bottom: 8px; width: auto; max-height: 50%; }
    .vpctl { left: auto; right: 10px; bottom: auto; top: 10px; }
    .ovnote { left: 10px; max-width: calc(100% - 20px); }
    .searchbox input[type="search"] { width: min(20em, calc(100vw - 150px)); }
    /* The bottom-docked card or tag panel would sit under the count line; move it above the
       search row instead of hiding it, so it stays reachable at any width. `.panelopen` is set
       in JS (a `:has()` cannot select this without nesting `:has()` inside `:has()`, which the
       selector spec disallows). */
    body.shell.panelopen .ovnote { bottom: auto; top: 50px; }
  }
  #querywrap { display: grid; grid-template-columns: minmax(0, 1fr) 320px; align-items: start; }
  @media (max-width: 900px) { #querywrap { grid-template-columns: 1fr; } #qside { border-left: 0 !important; border-top: 1px solid var(--line); } }
  #qmain { padding: 14px 20px 24px; min-width: 0; }
  textarea#sql { display: block; width: 100%; height: 11em; resize: vertical; font: 13px/1.45 ui-monospace, Menlo, monospace;
                 color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  textarea#sql:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .qbar { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 0; }
  button.primary { font: inherit; background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent);
                   border-radius: 6px; padding: 4px 14px; cursor: pointer; }
  button.primary:disabled { opacity: 0.6; cursor: progress; }
  #qstatus { color: var(--muted); font-variant-numeric: tabular-nums; }
  #qstatus.bad { color: var(--noise); }
  #qstatus .warn { color: var(--centre); }
  .qsave { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-left: auto; }
  .qsave input[type="text"] { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
                              border-radius: 6px; padding: 4px 8px; width: 11em; }
  #qresult { max-height: 60vh; overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  #qresult table { width: auto; min-width: 100%; }
  #qresult th { top: 0; background: var(--panel); }
  #qresult td { white-space: nowrap; max-width: 40em; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  #qresult td.null { color: var(--muted); font-style: italic; }
  #qresult tbody tr { cursor: default; }
  #qside { border-left: 1px solid var(--line); background: var(--panel); padding: 14px 18px; min-height: 60vh; }
  #qside h2 { font-size: 13px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  #qside h2:first-child { margin-top: 0; }
  #qside ul { list-style: none; margin: 0; padding: 0; }
  #qside li { display: flex; gap: 8px; align-items: baseline; justify-content: space-between; padding: 4px 0; border-bottom: 1px solid var(--line); }
  #qside li button.load { all: unset; cursor: pointer; flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #qside li button.load:hover, #qside li button.load:focus-visible { color: var(--accent); }
  #qside li .note { display: block; color: var(--muted); font-size: 12px; }
  #qside .group { color: var(--muted); font-size: 12px; margin: 8px 0 2px; }
</style>
</head>
<body>
<header>
  <h1>Tag explorer</h1>
  <div class="seg" role="group" aria-label="Section">
    <button type="button" data-tab="tags" aria-pressed="true">Tags</button>
    <button type="button" data-tab="query" aria-pressed="false">Query</button>
  </div>
  <div class="seg tagsonly" role="group" aria-label="Title type">
    <button type="button" data-kind="movie" aria-pressed="true">Movies</button>
    <button type="button" data-kind="show" aria-pressed="false">Shows</button>
  </div>
  <div class="seg tagsonly" role="group" aria-label="View">
    <button type="button" data-view="table" aria-pressed="true">Table</button>
    <button type="button" data-view="graph" aria-pressed="false">Tag network</button>
    <button type="button" data-view="map" aria-pressed="false">Title map</button>
  </div>
  <span class="stats tagsonly" id="stats">Loading…</span>
</header>
<div id="stage">
<div class="controls tagsonly" id="controls">
  <button type="button" class="plain" id="ctltoggle" aria-expanded="false" aria-controls="ctlbody">Filters &amp; noise (<span id="ctlnoise">0</span>)</button>
  <div class="ctlbody" id="ctlbody">
  <label>Filter <input type="search" id="filter" placeholder="tag contains…" autocomplete="off"></label>
  <label>Min titles <input type="number" id="mindf" min="1" value="2"></label>
  <label><input type="checkbox" id="noiseonly"> Noise only</label>
  <span class="noisebar">
    Noise: <strong id="noisecount">0</strong>
    <button type="button" class="plain" id="copy">Copy as JSON</button>
    <button type="button" class="plain" id="clear">Clear</button>
  </span>
  </div>
</div>
<textarea id="copyout" readonly hidden aria-label="Noise list as JSON"></textarea>
<div id="error" class="err" hidden></div>
<div id="querywrap" hidden>
  <div id="qmain">
    <textarea id="sql" spellcheck="false" aria-label="SQL"
              placeholder="SELECT … — one read-only statement. Cmd/Ctrl+Enter runs it."></textarea>
    <div class="qbar">
      <button type="button" class="primary" id="qrun">Run</button>
      <span id="qstatus"></span>
      <span class="qsave">
        <input type="text" id="qname" placeholder="Name" aria-label="Saved query name" autocomplete="off">
        <input type="text" id="qnote" placeholder="Note (optional)" aria-label="Saved query note" autocomplete="off">
        <button type="button" class="plain" id="qsavebtn">Save</button>
      </span>
    </div>
    <div id="qresult" hidden></div>
  </div>
  <aside id="qside">
    <h2>Saved queries</h2>
    <ul id="qsaved"><li class="empty">None yet.</li></ul>
    <h2>Recipes</h2>
    <div id="qrecipes"></div>
  </aside>
</div>
<main id="tagsmain">
  <div class="graphwrap" id="graphwrap" hidden>
    <div id="graphbox"><canvas id="network"></canvas></div>
    <div class="ovtl">
      <div class="searchbox">
        <input type="search" id="nsearch" placeholder="Search a tag…" autocomplete="off" aria-label="Search a tag"
               role="combobox" aria-expanded="false" aria-controls="nsugg">
        <ul class="sugg" id="nsugg" role="listbox" hidden></ul>
      </div>
      <label>Minimum titles per tag
        <input type="range" id="netmin" min="3" max="100" value="25" step="1">
        <output id="netminval" for="netmin">25</output>
      </label>
    </div>
    <span class="ovnote" id="gnote"></span>
  </div>
  <div class="graphwrap" id="mapwrap" hidden>
    <div id="mapbox"><canvas id="map"></canvas></div>
    <div class="ovtl">
      <div class="searchbox">
        <input type="search" id="msearch" placeholder="Search a title or a tag…" autocomplete="off" aria-label="Search a title or a tag"
               role="combobox" aria-expanded="false" aria-controls="msugg">
        <ul class="sugg" id="msugg" role="listbox" hidden></ul>
      </div>
    </div>
    <span class="ovnote" id="mnote"></span>
  </div>
  <div class="tablewrap" id="tablewrap">
    <table>
      <thead><tr>
        <th title="Mark as noise">Noise</th>
        <th class="sortable" data-sort="value">Tag<span class="arrow"></span></th>
        <th class="sortable num" data-sort="df">Titles<span class="arrow"></span></th>
        <th class="num" title="Share of titles of this type that carry any keyword">% of N</th>
        <th class="sortable num" data-sort="idf" title="1 + ln(N / titles)">IDF<span class="arrow"></span></th>
        <th>Appears with (shared titles)</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="more" id="more"></div>
  </div>
  <div id="rightcol">
    <aside id="detail"><p class="empty">Click a tag to list the titles that carry it.</p></aside>
  </div>
</main>
</div>
<script>
"use strict";
const PAGE = 300;
const NOISE_KEY = "plexdb-explore:noise";
const VIEWS = ["table", "graph", "map"];
const state = { tab: "tags", kind: "movie", view: "table", data: null, sort: "df", dir: -1, shown: PAGE, tag: null, tagIds: new Set() };

function loadNoise() {
  try { return new Set(JSON.parse(localStorage.getItem(NOISE_KEY) || "[]")); } catch { return new Set(); }
}
function saveNoise() {
  try { localStorage.setItem(NOISE_KEY, JSON.stringify([...noise].sort())); } catch { /* storage off: list lasts this page view */ }
  document.getElementById("noisecount").textContent = noise.size;
  document.getElementById("ctlnoise").textContent = noise.size;
}
const noise = loadNoise();

const el = (tag, props = {}, ...kids) => {
  const node = Object.assign(document.createElement(tag), props);
  for (const kid of kids) node.append(kid);
  return node;
};
const fmt = n => n.toLocaleString("en-US");
// A title's poster, proxied through /api/poster so the Plex token never
// reaches the browser (plex-db-ex-oyg.2). The monogram box is the fallback:
// it's already there when the image is requested, and stays visible if the
// image never loads (no rating key on file, or Plex has no thumb for it).
function posterThumb(itemId, title, extraClass = "") {
  const box = el("div", { className: ("poster " + extraClass).trim() }, (title || "?").trim().charAt(0).toUpperCase());
  if (!itemId) return box;
  const img = el("img", { loading: "lazy", decoding: "async", alt: "", src: `/api/poster?item_id=${encodeURIComponent(itemId)}` });
  img.addEventListener("error", () => img.remove(), { once: true });
  box.append(img);
  return box;
}
const noun = () => state.kind === "movie" ? "movies" : "shows";

function readHash() {
  const p = new URLSearchParams(location.hash.slice(1));
  if (p.get("kind") === "show" || p.get("kind") === "movie") state.kind = p.get("kind");
  if (VIEWS.includes(p.get("view"))) state.view = p.get("view");
  if (p.get("tab") === "query") state.tab = "query";
  state.tag = p.get("tag");
}
function writeHash() {
  const p = new URLSearchParams({ kind: state.kind, view: state.view });
  if (state.tab === "query") p.set("tab", "query");
  if (state.tag) p.set("tag", state.tag);
  history.replaceState(null, "", "#" + p.toString());
}

async function getJSON(url) {
  const res = await fetch(url);
  const body = await res.json();
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

async function loadKind() {
  document.querySelectorAll(".seg button[data-kind]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === state.kind)));
  document.getElementById("stats").textContent = "Loading…";
  const kind = state.kind;
  let data;
  try {
    data = await getJSON(`/api/tags?kind=${kind}`);
  } catch (err) {
    if (state.kind === kind) showError(err);
    return;
  }
  // A quick Movies → Shows click can land the Movies list second; drop it.
  if (state.kind !== kind) return;
  state.data = data;
  document.getElementById("error").hidden = true;
  const d = state.data;
  const singles = d.tags.filter(t => t.df === 1).length;
  document.getElementById("stats").textContent =
    `${fmt(d.titles)} ${noun()} with keywords · ${fmt(d.tags.length)} tags · ${fmt(singles)} on one title only`;
  state.shown = PAGE;
  render();
  if (state.view === "map") drawMap();
  if (state.view === "graph") loadNetwork();
  if (state.tag) showTag(state.tag); else writeHash();
}

function setView(view) {
  state.view = view;
  document.querySelectorAll(".seg button[data-view]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.view === view)));
  document.getElementById("tablewrap").hidden = view !== "table";
  document.getElementById("graphwrap").hidden = view !== "graph";
  document.getElementById("mapwrap").hidden = view !== "map";
  document.body.dataset.view = view;
  document.body.classList.toggle("shell", state.tab === "tags" && view !== "table");
  writeHash();
  // Before the first load, loadKind draws it once the tag list is in.
  if (view === "graph" && state.data) loadNetwork();
  if (view === "map" && state.data) drawMap();
}

// The world-unit bounding box of a set of points (anything with x and y).
function boundsOf(points) {
  const b = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  for (const it of points) { b.x0 = Math.min(b.x0, it.x); b.y0 = Math.min(b.y0, it.y); b.x1 = Math.max(b.x1, it.x); b.y1 = Math.max(b.y1, it.y); }
  return b;
}

// `base` padding widened by whichever side `panel` (a floating panel sharing the canvas's box,
// such as the pinned title card) actually covers, read from its real rendered box rather than a
// constant duplicated at each call site: on a wide window the right column's width is fixed by
// CSS regardless of content, but the bottom-docked height (CSS below 600px) is genuinely
// content-driven, up to its own `max-height` cap — a wide-and-short panel is that dock, anything
// else is the right column.
function clearOfPanel(canvas, panel, base) {
  const pad = { ...base };
  const c = canvas.getBoundingClientRect(), p = panel.getBoundingClientRect();
  if (p.width < 1 || p.height < 1) return pad;
  const margin = 16;
  if (p.width > c.width * 0.6) pad.b = Math.max(pad.b, c.bottom - p.top + margin);
  else pad.r = Math.max(pad.r, c.right - p.left + margin);
  return pad;
}

// ---- Viewport ----
// One 2D canvas that the tag network and the title map both sit on. It owns zoom, pan, the
// reset control and hit testing; the page hands it items (anything with x and y in world
// units) and a draw function, and gets back hover and click. Wheel zoom goes toward the cursor
// and the page never scrolls under it (the wheel listener is not passive so it can say so);
// one pointer drags, two pinch.
// The +, - and Reset buttons both viewports carry, laid over `parent`.
function zoomBar(parent, { zoomIn, zoomOut, reset }) {
  const bar = document.createElement("div");
  bar.className = "vpctl";
  for (const [label, title, fn] of [["+", "Zoom in", zoomIn], ["−", "Zoom out", zoomOut], ["Reset", "Show the whole picture", reset]]) {
    const b = document.createElement("button");
    Object.assign(b, { type: "button", textContent: label, title });
    b.setAttribute("aria-label", title);
    b.addEventListener("click", fn);
    bar.append(b);
  }
  parent.append(bar);
}

class Viewport {
  static MAX_ZOOM = 120;   // times the whole-picture scale
  static HIT_PX = 9;       // how near the pointer must be to an item to pick it

  constructor(canvas, { draw, onHover, onSelect }) {
    Object.assign(this, { canvas, draw, onHover, onSelect });
    this.items = []; this.bounds = { x0: 0, y0: 0, x1: 1, y1: 1 };
    this.k = 1; this.tx = 0; this.ty = 0; this.k0 = 1;
    this.fitted = true;            // still showing the whole picture, so a resize refits
    this.hover = null; this.selected = null;
    this.w = 0; this.h = 0; this.pad = 14; this.raf = 0;
    this.grid = null; this.ptrs = new Map(); this.gesture = null; this.last = null;
    canvas.addEventListener("wheel", e => this.wheel(e), { passive: false });
    canvas.addEventListener("pointerdown", e => this.down(e));
    canvas.addEventListener("pointermove", e => this.move(e));
    canvas.addEventListener("pointerup", e => this.up(e, true));
    canvas.addEventListener("pointercancel", e => this.up(e, false));
    canvas.addEventListener("pointerleave", e => { if (e.pointerType === "mouse" && !this.ptrs.size) this.setHover(null, 0, 0); });
    new ResizeObserver(() => this.resize()).observe(canvas);
    zoomBar(canvas.parentElement, { zoomIn: () => this.zoomAt(this.w / 2, this.h / 2, 1.6),
      zoomOut: () => this.zoomAt(this.w / 2, this.h / 2, 1 / 1.6), reset: () => this.reset() });
  }

  // World -> screen (CSS px inside the canvas).
  sx(x) { return x * this.k + this.tx; }
  sy(y) { return y * this.k + this.ty; }
  get zoom() { return this.k / this.k0; }

  // Replace the items. The index is a uniform grid in world units, sized for about two items per
  // cell, so a lookup touches the few cells under the pointer however many items there are.
  setItems(items, bounds) {
    this.items = items; this.bounds = bounds; this.hover = null;
    const bw = Math.max(bounds.x1 - bounds.x0, 1e-9), bh = Math.max(bounds.y1 - bounds.y0, 1e-9);
    const cell = Math.sqrt(bw * bh / Math.max(1, items.length / 2));
    const cols = Math.floor(bw / cell) + 1, rows = Math.floor(bh / cell) + 1;
    const cells = new Map();
    for (const it of items) {
      const key = Math.floor((it.y - bounds.y0) / cell) * cols + Math.floor((it.x - bounds.x0) / cell);
      const list = cells.get(key);
      if (list) list.push(it); else cells.set(key, [it]);
    }
    this.grid = { cell, cols, rows, cells };
    this.reset();
  }

  // The view that shows `b` centred in the screen area left after `pad` (a number of px all round,
  // or {l, t, r, b} to keep clear of panels floating over one side), no closer than `maxK` allows.
  viewFor(b, pad, maxK = Infinity) {
    const p = typeof pad === "number" ? { l: pad, t: pad, r: pad, b: pad } : pad;
    const aw = this.w - p.l - p.r, ah = this.h - p.t - p.b;
    const bw = Math.max(b.x1 - b.x0, 1e-9), bh = Math.max(b.y1 - b.y0, 1e-9);
    const k = Math.min(maxK, Math.max(1e-9, Math.min(aw / bw, ah / bh)));
    const cx = (b.x0 + b.x1) / 2, cy = (b.y0 + b.y1) / 2;
    return { k, tx: p.l + aw / 2 - cx * k, ty: p.t + ah / 2 - cy * k };
  }
  reset() {
    this.fitted = true;
    if (this.w && this.h) {
      const v = this.viewFor(this.bounds, this.pad);
      Object.assign(this, { k: v.k, tx: v.tx, ty: v.ty, k0: v.k });
    }
    this.redraw();
  }
  // Fit the given items on screen, no closer than the zoom limit allows.
  focusOn(items, pad = 70) {
    if (!items.length || !this.w) return;
    const v = this.viewFor(boundsOf(items), pad, this.k0 * Viewport.MAX_ZOOM);
    Object.assign(this, { k: v.k, tx: v.tx, ty: v.ty, fitted: false });
    this.updateHover();
    this.redraw();
  }
  centreOn(item) {
    this.tx = this.w / 2 - item.x * this.k; this.ty = this.h / 2 - item.y * this.k; this.fitted = false;
    this.redraw();
  }

  resize() {
    const w = this.canvas.clientWidth, h = this.canvas.clientHeight;
    if (!w || !h || (w === this.w && h === this.h)) return;
    const [ow, oh] = [this.w, this.h];
    this.w = w; this.h = h;
    const ratio = window.devicePixelRatio || 1;
    this.canvas.width = Math.round(w * ratio); this.canvas.height = Math.round(h * ratio);
    if (this.fitted || !ow) this.reset();
    else { this.tx += (w - ow) / 2; this.ty += (h - oh) / 2; this.redraw(); }
  }

  zoomAt(px, py, factor) {
    const k = Math.min(Math.max(this.k * factor, this.k0 * 0.9), this.k0 * Viewport.MAX_ZOOM);
    const f = k / this.k;
    this.tx = px - (px - this.tx) * f; this.ty = py - (py - this.ty) * f; this.k = k;
    this.fitted = false;
    this.updateHover();
    this.redraw();
  }

  wheel(e) {
    e.preventDefault();
    const r = this.canvas.getBoundingClientRect();
    const dy = e.deltaY * (e.deltaMode === 1 ? 16 : e.deltaMode === 2 ? this.h : 1);
    this.zoomAt(e.clientX - r.left, e.clientY - r.top, Math.exp(-dy * (e.ctrlKey ? 0.01 : 0.0015)));
  }

  point(e) { const r = this.canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  down(e) {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    this.canvas.setPointerCapture(e.pointerId);
    this.ptrs.set(e.pointerId, this.point(e));
    if (this.ptrs.size === 1) this.gesture = { start: this.point(e), moved: false };
    else this.gesture = { pinch: true, ...this.pinchOf() };
  }
  pinchOf() {
    const [a, b] = [...this.ptrs.values()];
    return { d: Math.hypot(a.x - b.x, a.y - b.y) || 1, cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2 };
  }
  move(e) {
    const p = this.point(e);
    const prev = this.ptrs.get(e.pointerId);
    if (!prev) { if (e.pointerType === "mouse") this.setHover(this.nearest(p.x, p.y), p.x, p.y); return; }
    this.ptrs.set(e.pointerId, p);
    const g = this.gesture;
    if (!g) return;
    if (g.pinch && this.ptrs.size >= 2) {
      const n = this.pinchOf();
      this.tx += n.cx - g.cx; this.ty += n.cy - g.cy;
      this.zoomAt(n.cx, n.cy, n.d / g.d);
      this.gesture = { pinch: true, ...n };
    } else if (!g.pinch) {
      if (!g.moved && Math.hypot(p.x - g.start.x, p.y - g.start.y) > 4) { g.moved = true; this.canvas.classList.add("dragging"); this.setHover(null, 0, 0); }
      if (g.moved) { this.tx += p.x - prev.x; this.ty += p.y - prev.y; this.fitted = false; this.redraw(); }
    }
  }
  up(e, ok) {
    const g = this.gesture;
    const p = this.point(e);
    this.ptrs.delete(e.pointerId);
    this.canvas.classList.remove("dragging");
    if (this.ptrs.size === 1) {
      // A pinch ended with one finger left: carry on as a drag from where it is.
      const [rest] = this.ptrs.values();
      this.gesture = { start: rest, moved: true };
    } else if (!this.ptrs.size) {
      this.gesture = null;
      if (ok && g && !g.pinch && !g.moved) { const it = this.nearest(p.x, p.y); if (it) this.onSelect(it); }
    }
  }

  // Nearest item within HIT_PX of a screen point, found through the grid in world coordinates.
  nearest(sx, sy) {
    const gr = this.grid;
    if (!gr) return null;
    const { x0, y0 } = this.bounds;
    const wx = (sx - this.tx) / this.k, wy = (sy - this.ty) / this.k, r = Viewport.HIT_PX / this.k;
    const cx0 = Math.max(0, Math.floor((wx - r - x0) / gr.cell)), cx1 = Math.min(gr.cols - 1, Math.floor((wx + r - x0) / gr.cell));
    const cy0 = Math.max(0, Math.floor((wy - r - y0) / gr.cell)), cy1 = Math.min(gr.rows - 1, Math.floor((wy + r - y0) / gr.cell));
    let best = null, bestD = Viewport.HIT_PX ** 2;
    for (let cy = cy0; cy <= cy1; cy++) for (let cx = cx0; cx <= cx1; cx++) {
      const list = gr.cells.get(cy * gr.cols + cx);
      if (!list) continue;
      for (const it of list) {
        const d = (this.sx(it.x) - sx) ** 2 + (this.sy(it.y) - sy) ** 2;
        if (d < bestD) { bestD = d; best = it; }
      }
    }
    return best;
  }

  setHover(item, x, y) {
    this.last = item ? { x, y } : null;
    if (item !== this.hover) { this.hover = item; this.redraw(); }
    this.onHover(item, x, y);
  }
  updateHover() { if (this.last) this.setHover(this.nearest(this.last.x, this.last.y), this.last.x, this.last.y); }

  redraw() {
    if (this.raf) return;
    this.raf = requestAnimationFrame(() => { this.raf = 0; this.paint(); });
  }
  paint() {
    if (!this.w) return;
    const ctx = this.canvas.getContext("2d");
    const ratio = this.canvas.width / this.w;
    ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
    ctx.clearRect(0, 0, this.w, this.h);
    this.draw(ctx, this);
  }
}

// ---- Title card ----
// What a title looks like on hover and when pinned. The poster and description slots hold a
// placeholder until a source for them exists; the rest comes from /api/title.
const detailCache = new Map();
function titleDetail(itemId) {
  if (!detailCache.has(itemId)) {
    detailCache.set(itemId, getJSON(`/api/title?item_id=${encodeURIComponent(itemId)}`).catch(err => { detailCache.delete(itemId); throw err; }));
  }
  return detailCache.get(itemId);
}

class TitleCard {
  constructor(box, { pinned, onClose, onTag, onPick, canPick, onDetail }) {
    this.pinned = pinned; this.onTag = onTag; this.onPick = onPick; this.canPick = canPick; this.onDetail = onDetail;
    this.root = el("div", { className: "tcard " + (pinned ? "pinned" : "hover"), hidden: true });
    if (pinned) {
      this.root.setAttribute("role", "dialog"); this.root.setAttribute("aria-label", "Title details");
      const x = el("button", { type: "button", className: "close", title: "Close (Esc)", textContent: "✕" });
      x.setAttribute("aria-label", "Close the card");
      x.addEventListener("click", onClose);
      this.close = x;
    }
    this.itemId = null;
    box.append(this.root);
  }
  hide() { this.itemId = null; this.root.hidden = true; }
  // `item` is the map point, enough for a heading at once; the details fill in when they arrive.
  async show(item) {
    this.itemId = item.id;
    this.paint(item, null, null);
    this.root.hidden = false;
    if (!this.pinned) return;
    let detail = null, err = null;
    try { detail = await titleDetail(item.id); } catch (e) { err = e; }
    if (this.itemId === item.id) {
      this.paint(item, detail, err);
      if (this.onDetail && detail) this.onDetail(item, detail);
    }
  }
  paint(item, d, err) {
    if (!this.pinned) {
      this.root.replaceChildren(el("h3", {}, item.year ? `${item.title} (${item.year})` : item.title));
      return;
    }
    const title = d ? d.title : item.title, year = d ? d.year : item.year;
    const facts = d ? [d.studio, d.content_rating].filter(Boolean).join(" · ") : "";
    const head = el("div", {}, el("h3", {}, year ? `${title} (${year})` : title),
      el("div", { className: "meta" }, d ? (facts || "no studio or rating on file") : err ? `Could not load: ${err.message}` : "Loading…"));
    const parts = [el("div", { className: "top" }, posterThumb(this.itemId, title), head),
      el("p", { className: "desc" }, "No description yet.")];
    if (d) {
      const chips = el("div");
      for (const { value, label } of d.keywords.slice(0, 40)) {
        const chip = el("span", { className: "chip" + (noise.has(value) ? " noise" : "") }, label);
        if (this.pinned) { chip.title = "Highlight the titles carrying it"; chip.addEventListener("click", () => this.onTag(value)); }
        chips.append(chip);
      }
      if (d.keywords.length > 40) chips.append(el("span", { className: "meta" }, ` +${fmt(d.keywords.length - 40)} more`));
      parts.push(el("h4", {}, `Tags (${fmt(d.keywords.length)})`), d.keywords.length ? chips : el("div", { className: "meta" }, "none"));
      const list = el("ol");
      for (const s of d.similar) {
        const on = this.canPick(s.item_id);
        const li = el("li", { className: on ? "link" : "off", title: on ? "Show it on the map" : "Not on the map" },
          el("span", { className: "rk" }, `#${s.rank}`), el("span", {}, s.year ? `${s.title} (${s.year})` : s.title));
        if (on && this.pinned) li.addEventListener("click", () => this.onPick(s.item_id));
        list.append(li);
      }
      parts.push(el("h4", {}, "Similar titles"), d.similar.length ? list : el("div", { className: "meta" }, "none recorded"));
    }
    this.root.replaceChildren(...(this.close ? [this.close] : []), ...parts);
  }
}

// ---- Map view ----
// `data` is what is on screen. `dim` is set while it is the default map standing in for one
// still being drawn without the noise tags. `defaults` keeps each kind's default map, which the
// server has stored and answers in milliseconds. `items` is `data.points` as viewport items.
// `labels` are the region labels of `data`, `shown` is the text of the labels drawn in the last
// frame (what a test reads to see the labels change).
const map = { data: null, key: null, items: [], byId: new Map(), itemsOf: null, dim: false, defaults: {}, labels: [], shown: [] };
// `search` is null, or {type: "title"|"tag", label, ids: Set of item_ids to keep at full strength,
// focus: the searched title's id}. Everything outside `ids` is drawn faded.
// `similar` is the item_ids of the pinned title's similar titles that are on this map: they are
// drawn in the accent colour, with a line from the pinned title to each.
const mapUI = { search: null, token: 0, similar: [] };

async function mapRequest(kind, exclude) {
  const p = new URLSearchParams({ kind });
  for (const t of exclude) p.append("exclude", t);
  return getJSON(`/api/map?${p}`);
}
async function drawMap() {
  const note = document.getElementById("mnote");
  const kind = state.kind;
  const key = [kind, ...[...noise].sort()].join("\u0001");
  if (map.key !== key) {
    map.key = key;
    try {
      let base = map.defaults[kind] || null;
      map.data = base; map.dim = noise.size > 0 && base !== null;
      note.textContent = `Placing every ${noun().slice(0, -1)} by its keywords…`;
      paintMap();
      if (!base) {
        base = await mapRequest(kind, []);
        if (map.key !== key) return;
        map.defaults[kind] = base;
        map.data = base; map.dim = noise.size > 0;
        paintMap();
      }
      if (noise.size > 0) {
        const live = await mapRequest(kind, noise);
        if (map.key !== key) return;
        map.data = live; map.dim = false;
      }
    } catch (err) {
      if (map.key !== key) return;
      map.data = null; map.dim = false; map.key = null; paintMap();
      note.textContent = `Could not load: ${err.message}`;
      return;
    }
  }
  paintMap();
}

function mapNote() {
  const d = map.data;
  if (!d) return;
  if (map.dim) {
    document.getElementById("mnote").textContent =
      `Recomputing without ${fmt(noise.size)} noise-marked tag${noise.size === 1 ? "" : "s"} — this takes tens of seconds. Showing the default map, dimmed, until it lands…`;
    return;
  }
  const lit = d.points.filter(p => state.tagIds.has(p[0])).length;
  document.getElementById("mnote").textContent =
    `${fmt(d.points.length)} ${noun()}, close together when their keywords are alike (UMAP)`
    + (d.unplaced ? `; ${fmt(d.unplaced)} share no tag with anything and are left off` : "")
    + (state.tag ? `; ${fmt(lit)} carrying “${state.tag}” highlighted` : "")
    + (noise.size ? `; ${fmt(noise.size)} noise-marked tags ignored` : "")
    + ". Labels name each region and get finer as you zoom in. Scroll to zoom, drag to pan, hover a dot for its card, click to pin it.";
}

// A new `data` becomes new viewport items; the selection follows its title if it is still there.
function syncMapItems() {
  if (map.itemsOf === map.data) return;
  map.itemsOf = map.data;
  const pts = map.data ? map.data.points : [];
  map.items = pts.map(p => ({ id: p[0], title: p[1], year: p[2], x: p[3], y: p[4], lower: p[1].toLowerCase() }));
  map.byId = new Map(map.items.map(it => [it.id, it]));
  map.labels = (map.data && map.data.labels || []).map(([node, x, y, w, h, n, text, tag]) =>
    ({ node, x, y, w, h, n, text, tag, depth: Math.floor(Math.log2(node + 1)), tw: 0 }));
  const b = map.items.length ? boundsOf(map.items) : { x0: 0, y0: 0, x1: 1, y1: 1 };
  const keep = mapVP.selected && map.byId.get(mapVP.selected.id);
  mapVP.setItems(map.items, b);
  if (keep) mapVP.selected = keep; else selectItem(null);
}

function paintMap() {
  if (state.view !== "map") return;
  syncMapItems();
  document.getElementById("map").classList.toggle("dim", map.dim && !!map.data);
  mapNote();
  mapVP.resize();
  mapVP.redraw();
}

function drawMapItems(ctx, vp) {
  if (!map.items.length) return;
  const css = getComputedStyle(document.documentElement);
  const token = name => css.getPropertyValue(name).trim();
  const r = Math.min(4.5, 1.2 * Math.pow(vp.zoom, 0.4));
  const S = mapUI.search ? mapUI.search.ids : null;
  const near = (x, y) => x > -10 && y > -10 && x < vp.w + 10 && y < vp.h + 10;
  ctx.fillStyle = token("--edge");
  ctx.globalAlpha = S ? 0.14 : 1;
  const lit = [];
  for (const it of map.items) {
    if (S ? S.has(it.id) : state.tagIds.has(it.id)) { lit.push(it); continue; }
    const x = vp.sx(it.x), y = vp.sy(it.y);
    if (near(x, y)) ctx.fillRect(x - r, y - r, 2 * r, 2 * r);
  }
  ctx.globalAlpha = 1;
  ctx.fillStyle = token(S ? "--accent" : "--centre");
  for (const it of lit) {

// Region labels, coarse to fine. Each region is named by one tag and is a node of a binary split
// of the map (children of node i are 2i+1 and 2i+2). A label shows once its text fits inside its
// region's width on screen (90px or more), and gives way once a finer label inside the region is
// actually placed; a label that would overlap one already placed (larger regions place first), or
// repeats one, is left out. A region's own child is decided before the region itself — a dropped
// child (overlap or a repeated word) leaves its region open for the parent instead of unlabeled
// (plex-db-ex-1u6.7) — but that is the only reordering: two unrelated regions still compete for an
// overlap by member count, larger first.

  const fits = l => l.w * vp.k >= Math.max(90, l.tw * 0.8) && l.h * vp.k >= LABEL_FONT(l.depth);
  for (const l of map.labels) if (!l.tw) { ctx.font = `600 ${LABEL_FONT(l.depth)}px system-ui, sans-serif`; l.tw = ctx.measureText(l.text).width; }
  const eligible = new Map();

    if (!fits(l)) continue;
    const x = vp.sx(l.x), y = vp.sy(l.y), size = LABEL_FONT(l.depth);
    if (x + l.tw / 2 < 0 || x - l.tw / 2 > vp.w || y + size < 0 || y - size > vp.h) continue;
    eligible.set(l.node, { l, x, y, size });
  }
  const fittingKids = node => [2 * node + 1, 2 * node + 2].map(i => eligible.get(i)).filter(Boolean);
  // Larger regions place first, except a region waits for its own fitting child to be decided
  // first — deferred to a later pass rather than reordered past any unrelated region.

      if (fittingKids(c.l.node).some(k => !decided.has(k.l.node))) { next.push(c); continue; }
      decided.add(c.l.node);
      if (fittingKids(c.l.node).some(k => placedNodes.has(k.l.node))) continue;
      const { l, x, y, size } = c;
      const box = { x0: x - l.tw / 2 - 4, x1: x + l.tw / 2 + 4, y0: y - size / 2 - 2, y1: y + size / 2 + 2 };
      if (seen.has(l.text) || placed.some(b => box.x0 < b.x1 && box.x1 > b.x0 && box.y0 < b.y1 && box.y1 > b.y0)) continue;
      placed.push(box); seen.add(l.text); placedNodes.add(l.node);

  ctx.strokeStyle = token("--panel");

    map.shown.push(l.text);
    ctx.font = `600 ${size}px system-ui, sans-serif`;
    ctx.lineWidth = 4;
    ctx.globalAlpha = mapUI.search ? 0.35 : 0.9;
    ctx.strokeText(l.text, x, y);
    ctx.fillStyle = token("--ink");
    ctx.fillText(l.text, x, y);
  }
  ctx.restore();
}

// ---- Map: hover, selection, search ----
const mapBox = document.getElementById("mapbox");
const canPick = id => map.byId.has(id);

  onDetail: (item, d) => { if (mapVP.selected === item) { mapUI.similar = d.similar.map(s => s.item_id).filter(canPick); mapVP.redraw(); } } });

const searchEl = document.getElementById("msearch"), suggEl = document.getElementById("msugg");

    .sort((a, b) => (a.value.startsWith(q) ? 0 : 1) - (b.value.startsWith(q) ? 0 : 1) || b.df - a.df).slice(0, 6);

// ---- Tag network view ----
// `net.full` is every tag the server laid out for the current kind and noise
// exclusions (every tag on at least NETWORK_MIN_DF titles, positioned so tags
// on the same titles sit close together). `net.min` is the page's own
// "minimum titles per tag" floor: raising or lowering it only re-filters
// `net.full` into `net.nodes`/`net.edges` — the slice currently drawn — so the
// slider never re-fetches or re-lays-out the network. An edge is kept only
// when both tags it names are in `net.nodes`.
const net = { key: null, full: null, min: 25, nodes: [], byValue: new Map(), edges: [], itemsOf: null };

async function networkRequest(kind, exclude) {
  const p = new URLSearchParams({ kind });
  for (const t of exclude) p.append("exclude", t);
  return getJSON(`/api/tagnetwork?${p}`);
}

async function loadNetwork() {
  const note = document.getElementById("gnote");
  const kind = state.kind;
  const key = [kind, ...[...noise].sort()].join("\u0001");
  if (net.key !== key) {
    note.textContent = "Loading the whole network…";
    net.full = null; net.key = null;
    paintNetwork();
    let full;
    try { full = await networkRequest(kind, noise); }
    catch (err) {
      if (kind !== state.kind) return;
      note.textContent = `Could not load: ${err.message}`;
      return;
    }
    if (kind !== state.kind) return;

  }

// A new `net.full` or a moved slider becomes new viewport items; the
// selection follows its tag if it is still above the floor.
function syncNetworkItems() {
  if (!(net.itemsOf && net.itemsOf[0] === net.full && net.itemsOf[1] === net.min)) {
    net.itemsOf = [net.full, net.min];
    const shown = net.full ? net.full.nodes.filter(n => n[1] >= net.min) : [];
    net.nodes = shown.map(([value, df, x, y]) => ({ id: value, title: value, x, y, df }));
    net.byValue = new Map(net.nodes.map(it => [it.id, it]));
    net.edges = net.full ? net.full.edges.filter(([a, b]) => net.byValue.has(a) && net.byValue.has(b)) : [];

    netVP.setItems(net.nodes, b);
  }

  // permalink that opens on a tag before the network has loaded would
  // otherwise latch a `null` selection that a later `net.full` arrival never
  // revisits.
  netVP.selected = net.byValue.get(state.tag) || null;
}

function paintNetwork() {
  if (state.view !== "graph") return;
  syncNetworkItems();
  netVP.resize();
  netVP.redraw();
  if (!net.full) return;
  document.getElementById("gnote").textContent =
    `${fmt(net.nodes.length)} tags on at least ${fmt(net.min)} ${noun()} each, `
    + `${fmt(net.edges.length)} lines joining tags on the same ${noun()}, thicker for more; node size is ${noun()} carrying it`
    + (noise.size ? `; ${fmt(noise.size)} noise-marked tags left out` : "")
    + ". Scroll to zoom, drag to pan, click a tag for its panel.";

// Node radius and the label budget both grow with df and with zoom, so the
// whole network is legible at full zoom-out and finer tags appear as it fills
// the screen.

  const r = it => nodeRadius(it, maxDf, vp.zoom);
  const near = (x, y, pad) => x > -pad && y > -pad && x < vp.w + pad && y < vp.h + pad;
  const neighbours = vp.selected
    ? new Set(net.edges.filter(([a, b]) => a === vp.selected.id || b === vp.selected.id).flatMap(([a, b]) => [a, b]))
    : null;

    if (placed.some(p => box.x0 < p.x1 && box.x1 > p.x0 && box.y0 < p.y1 && box.y1 > p.y0)) continue;

function visible() {
  const q = document.getElementById("filter").value.trim().toLowerCase();
  const min = Math.max(1, Number(document.getElementById("mindf").value) || 1);
  const only = document.getElementById("noiseonly").checked;
  let tags = state.data.tags.filter(t => t.df >= min && (!q || t.value.includes(q)) && (!only || noise.has(t.value)));
  const { sort, dir } = state;
  tags = tags.slice().sort((a, b) => {
    const x = a[sort], y = b[sort];
    const c = typeof x === "string" ? x.localeCompare(y) : x - y;
    return c * dir || a.value.localeCompare(b.value);
  });
  return tags;
}

function render() {
  if (!state.data) return;
  const tags = visible();
  const n = state.data.titles;
  const body = document.getElementById("rows");
  body.replaceChildren();
  for (const t of tags.slice(0, state.shown)) {
    const box = el("input", { type: "checkbox", checked: noise.has(t.value), title: "Mark as noise" });
    box.addEventListener("click", e => e.stopPropagation());
    box.addEventListener("change", () => {
      box.checked ? noise.add(t.value) : noise.delete(t.value);
      saveNoise();
      tr.classList.toggle("noise", box.checked);
      // Under "Noise only" the row must leave or join the table at once.
      if (document.getElementById("noiseonly").checked) render();
    });
    const co = el("td");
    for (const [value, count] of t.co) {
      const chip = el("span", { className: "chip", title: `${fmt(count)} ${noun()} carry both` }, value, el("span", { className: "n" }, fmt(count)));
      chip.addEventListener("click", e => { e.stopPropagation(); showTag(value); });
      co.append(chip);
    }
    const tr = el("tr", {},
      el("td", {}, box),
      el("td", { className: "tag" }, t.value),
      el("td", { className: "num" }, fmt(t.df)),
      el("td", { className: "num" }, (100 * t.df / n).toFixed(t.df / n >= 0.01 ? 1 : 2) + "%"),
      el("td", { className: "num" }, t.idf.toFixed(2)),
      co);
    tr.dataset.tag = t.value;
    if (noise.has(t.value)) tr.classList.add("noise");
    if (t.value === state.tag) tr.classList.add("selected");
    tr.addEventListener("click", () => showTag(t.value));
    body.append(tr);
  }
  const more = document.getElementById("more");
  more.replaceChildren(`Showing ${fmt(Math.min(state.shown, tags.length))} of ${fmt(tags.length)} tags`);
  if (tags.length > state.shown) {
    const btn = el("button", { type: "button", className: "plain" }, `Show ${PAGE} more`);
    btn.addEventListener("click", () => { state.shown += PAGE; render(); });
    more.append(btn);
  }
  document.querySelectorAll("th.sortable").forEach(th => {
    th.querySelector(".arrow").textContent = th.dataset.sort === state.sort ? (state.dir < 0 ? "↓" : "↑") : "";
  });
}

async function showTag(value) {
  state.tag = value;
  writeHash();
  document.querySelectorAll("tbody tr").forEach(tr => tr.classList.toggle("selected", tr.dataset.tag === value));
  syncNetworkItems();
  netVP.redraw();
  const aside = document.getElementById("detail");
  const t = state.data && state.data.tags.find(x => x.value === value);
  aside.replaceChildren(el("h2", {}, value), el("p", { className: "sub" }, "Loading…"));
  let body;
  try { body = await getJSON(`/api/titles?kind=${state.kind}&tag=${encodeURIComponent(value)}`); }
  catch (err) { aside.querySelector(".sub").textContent = `Could not load: ${err.message}`; return; }
  if (state.tag !== value) return;
  state.tagIds = new Set(body.titles.map(x => x.item_id));
  if (state.view === "map") paintMap();
  const sub = t ? `${fmt(t.df)} ${noun()} · IDF ${t.idf.toFixed(2)}` : `not on any ${noun().slice(0, -1)}`;
  const parts = [el("h2", {}, value), el("p", { className: "sub" }, sub)];
  if (t && t.co.length) {
    const co = el("div", { className: "chips" });
    for (const [coValue, count] of t.co) {
      const chip = el("span", { className: "chip", title: `${fmt(count)} ${noun()} carry both` }, coValue, el("span", { className: "n" }, fmt(count)));
      chip.addEventListener("click", () => showTag(coValue));
      co.append(chip);
    }
    parts.push(el("h4", {}, "Appears with"), co);
  }
  const list = el("ol");
  for (const x of body.titles) {
    const row = el("div", { className: "trow" }, posterThumb(x.item_id, x.title, "small"),
      el("span", {}, x.year ? `${x.title} (${x.year})` : x.title));
    list.append(el("li", {}, row,
      el("span", { className: "kw", title: "keywords this title carries" }, `${fmt(x.keywords)} kw`)));
  }
  parts.push(el("h4", {}, `Titles (${fmt(body.titles.length)})`), list);
  aside.replaceChildren(...parts);
}

document.querySelectorAll(".seg button[data-view]").forEach(b => b.addEventListener("click", () => setView(b.dataset.view)));
document.querySelectorAll(".seg button[data-kind]").forEach(b => b.addEventListener("click", () => {
  if (state.kind === b.dataset.kind) return;
  state.kind = b.dataset.kind; state.tag = null; state.tagIds = new Set();
  clearSearch();
  document.getElementById("detail").replaceChildren(el("p", { className: "empty" }, "Click a tag to list the titles that carry it."));
  loadKind();
}));
document.querySelectorAll("th.sortable").forEach(th => th.addEventListener("click", () => {
  const key = th.dataset.sort;
  if (state.sort === key) state.dir = -state.dir;
  else { state.sort = key; state.dir = key === "value" ? 1 : -1; }
  render();
}));
for (const id of ["filter", "mindf", "noiseonly"]) {
  document.getElementById(id).addEventListener("input", () => { state.shown = PAGE; render(); });
}
document.getElementById("copy").addEventListener("click", async () => {
  const text = JSON.stringify([...noise].sort());
  const out = document.getElementById("copyout");
  const btn = document.getElementById("copy");
  try {
    await navigator.clipboard.writeText(text);
    btn.textContent = "Copied"; out.hidden = true;
  } catch {
    // No clipboard outside a secure context (plain http on a LAN address): show it to copy by hand.
    out.value = text; out.hidden = false; out.select();
    btn.textContent = "Select and copy below";
  }
  setTimeout(() => { btn.textContent = "Copy as JSON"; }, 2000);
});
document.getElementById("clear").addEventListener("click", () => {
  const btn = document.getElementById("clear");
  if (btn.dataset.armed !== "1") {
    btn.dataset.armed = "1"; btn.textContent = `Clear ${noise.size}?`;
    setTimeout(() => { btn.dataset.armed = ""; btn.textContent = "Clear"; }, 3000);
    return;
  }
  noise.clear(); saveNoise(); btn.dataset.armed = ""; btn.textContent = "Clear"; render();
});

// ---- Query tab ----
// The server holds the guards (read-only, one statement, 5 s, 500 rows). Saved queries live in a
// JSON file beside the store, so they follow the server rather than this browser.
const q = { ready: false, running: false };
const qEl = id => document.getElementById(id);

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".seg button[data-tab]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.tab === tab)));
  document.querySelectorAll(".tagsonly").forEach(n => { n.hidden = tab !== "tags"; });
  qEl("tagsmain").hidden = tab !== "tags";
  qEl("querywrap").hidden = tab !== "query";
  if (tab === "tags") { document.getElementById("error").hidden = !document.getElementById("error").textContent; setView(state.view); }
  else { document.body.classList.remove("shell"); document.getElementById("error").hidden = true; writeHash(); initQuery(); }
}

function qStatus(text, bad = false, ...extra) {
  const box = qEl("qstatus");
  box.className = bad ? "bad" : "";
  box.replaceChildren(text, ...extra);
}

async function sendJSON(method, url, body) {
  const res = await fetch(url, { method, headers: { "Content-Type": "application/json" }, body: body === undefined ? undefined : JSON.stringify(body) });
  const out = await res.json();
  if (!res.ok) throw new Error(out.error || res.statusText);
  return out;
}

async function runQuery() {
  if (q.running) return;
  const sql = qEl("sql").value;
  q.running = true; qEl("qrun").disabled = true;
  qStatus("Running…");
  let out;
  try { out = await sendJSON("POST", "/api/query", { sql }); }
  catch (err) { qStatus(err.message, true); qEl("qresult").hidden = true; return; }
  finally { q.running = false; qEl("qrun").disabled = false; }
  const head = el("tr", {}, ...out.columns.map(c => el("th", {}, c)));
  const body = el("tbody");
  for (const row of out.rows) {
    body.append(el("tr", {}, ...row.map(v => {
      const label = typeof v === "string" && Object.hasOwn(out.labels, v) ? out.labels[v] : null;
      if (label !== null) {
        const td = el("td", {}, el("div", { className: "cellrow" }, posterThumb(v, label, "small"), el("span", {}, label)),
          el("div", { className: "cellid" }, v));
        td.title = `${label}\n${v}`;
        return td;
      }
      const td = el("td", v === null ? { className: "null" } : {}, v === null ? "NULL" : String(v));
      td.title = td.textContent;
      return td;
    })));
  }
  qEl("qresult").replaceChildren(el("table", {}, el("thead", {}, head), body));
  qEl("qresult").hidden = false;
  qStatus(`${fmt(out.row_count)} row${out.row_count === 1 ? "" : "s"} · ${fmt(out.elapsed_ms)} ms`, false,
    ...(out.truncated ? [el("span", { className: "warn" }, ` · truncated: more rows exist, only the first ${fmt(out.row_count)} are shown`)] : []));
}

function loadIntoEditor(sql, name = "", note = "") {
  qEl("sql").value = sql; qEl("qname").value = name; qEl("qnote").value = note;
  qEl("sql").focus();
}

function paintSaved(queries) {
  const list = qEl("qsaved");
  if (!queries.length) { list.replaceChildren(el("li", { className: "empty" }, "None yet.")); return; }
  list.replaceChildren(...queries.map(item => {
    const load = el("button", { type: "button", className: "load", title: item.sql }, item.name);
    if (item.note) load.append(el("span", { className: "note" }, item.note));
    load.addEventListener("click", () => loadIntoEditor(item.sql, item.name, item.note));
    const del = el("button", { type: "button", className: "plain", title: "Delete this saved query" }, "Delete");
    del.addEventListener("click", async () => {
      if (del.dataset.armed !== "1") {
        del.dataset.armed = "1"; del.textContent = "Sure?";
        setTimeout(() => { del.dataset.armed = ""; del.textContent = "Delete"; }, 3000);
        return;
      }
      try { paintSaved((await sendJSON("DELETE", `/api/saved?name=${encodeURIComponent(item.name)}`)).queries); }
      catch (err) { qStatus(err.message, true); }
    });
    return el("li", {}, load, del);
  }));
}

async function saveQuery() {
  const name = qEl("qname").value.trim();
  if (!name) { qStatus("Give the query a name to save it.", true); qEl("qname").focus(); return; }
  try {
    const out = await sendJSON("PUT", "/api/saved", { name, sql: qEl("sql").value, note: qEl("qnote").value.trim() });
    paintSaved(out.queries); qStatus(`Saved “${name}”.`);
  } catch (err) { qStatus(err.message, true); }
}

async function initQuery() {
  if (q.ready) return;
  q.ready = true;
  try {
    paintSaved((await getJSON("/api/saved")).queries);
    const box = qEl("qrecipes");
    let group = null;
    for (const r of (await getJSON("/api/recipes")).recipes) {
      if (r.group !== group) { group = r.group; box.append(el("div", { className: "group" }, group)); }
      const b = el("button", { type: "button", className: "load", title: r.sql }, r.name);
      b.addEventListener("click", () => loadIntoEditor(r.sql, "", ""));
      box.append(el("ul", {}, el("li", {}, b)));
    }
  } catch (err) { q.ready = false; qStatus(`Could not load: ${err.message}`, true); }
}

qEl("qrun").addEventListener("click", runQuery);
qEl("qsavebtn").addEventListener("click", saveQuery);
qEl("sql").addEventListener("keydown", e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); runQuery(); } });
document.querySelectorAll(".seg button[data-tab]").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));

document.getElementById("noisecount").textContent = noise.size;
document.getElementById("ctlnoise").textContent = noise.size;
document.getElementById("ctltoggle").addEventListener("click", () => {
  const box = document.getElementById("controls");
  const open = box.classList.toggle("open");
  document.getElementById("ctltoggle").setAttribute("aria-expanded", String(open));
});
readHash();
setView(state.view);
loadKind();
if (state.tab === "query") setTab("query");
</script>
</body>
</html>
