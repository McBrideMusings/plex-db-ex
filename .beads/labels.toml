# Every bead carries at least one of these: the part of the repo the work edits.
required = ["ingest", "enrich", "keywords", "explore", "reader", "store", "tooling", "docs"]

[labels.ingest]
about = "Reading Plex and Tautulli into the store: walk, ingest_plays, sweep, identity repair, scheduling."

[labels.enrich]
about = "Enrichers that fetch from outside sources: TMDB keywords and edges, Wikidata, AniList, Letterboxd, MDBList."

[labels.keywords]
about = "Keyword cleanup: forms, synonyms and pair judging, roles, names, merge and film-suffix verdicts."

[labels.explore]
about = "Plex TVX, the explore web UI: map, tags table, tag network graph, query tab, and the refresh jobs that feed them."

[labels.reader]
about = "crates/plexdb-reader, the read-only Rust crate etv-station vendors: taste vectors, enrichment, edges."

[labels.store]
about = "The plexdb schema, migrations, publish/snapshot, and the store's invariants."

[labels.tooling]
about = "Tests, admin.toml tasks, tools/, verify-project, the Dockerfile and deploy."

[labels.docs]
about = "docs/ (PRD, spec, schema, ADRs, CONTEXT.md), CLAUDE.md."

[labels.perf]
about = "The complaint is a number: query time, refresh time, memory."

[labels.ui]
about = "How a Plex TVX screen looks."

[labels.ux]
about = "How a person moves through Plex TVX or the CLI to get something done."

[labels.human]
about = "Needs a person: a decision, a look at the real UI, an account, a manual check."
