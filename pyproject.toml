[project]
name = "plex-db-ex"
version = "0.1.0"
description = "Extended Plex metadata and affinity store"
requires-python = ">=3.12"
dependencies = [
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "scipy>=1.13",
    "umap-learn>=0.5.12",
    "snowballstemmer>=3.1.1",
]

[project.scripts]
plexdb = "plexdb.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "playwright>=1.63.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["plexdb"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

# scikit-learn, scipy and umap-learn ship no type information; the map is the one place
# that calls them, through a handful of documented functions.
[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "umap.*"]
ignore_missing_imports = true

# snowballstemmer ships no type information either; keywords.py is the one place
# that calls it.
[[tool.mypy.overrides]]
module = ["snowballstemmer.*"]
ignore_missing_imports = true
