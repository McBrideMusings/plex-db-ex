[package]
name = "plexdb"
version = "0.1.0"
edition = "2024"
description = "The plexdb writer's sweep steps that have moved from the Python package (ADR-0001)."

[dependencies]
plexdb-keywords = { path = "../plexdb-keywords" }
plexdb-schema = { path = "../plexdb-schema" }
plexdb-store = { path = "../plexdb-store" }
rusqlite = { workspace = true }
# `preserve_order`: a list's JSON keeps the key order `plexdb lists --json` prints it in.
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror = { workspace = true }
# The list harvests' HTTP calls to MDBList and Letterboxd, both https. Only this crate
# turns TLS on; the reader stays plain http (ADR-0026).
ureq = { workspace = true, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

# Named `plexdb-rs` while the Python package still owns `plexdb` on PATH; the
# last slice of the move renames it.
[[bin]]
name = "plexdb-rs"
path = "src/main.rs"

[lib]
name = "plexdb"
path = "src/lib.rs"
