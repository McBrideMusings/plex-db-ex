[package]
name = "plexdb"
version = "0.1.0"
edition = "2024"
description = "The plexdb writer's sweep steps that have moved from the Python package (ADR-0001)."

[dependencies]
plexdb-keywords = { path = "../plexdb-keywords" }
plexdb-reader = { path = "../plexdb-reader" }
plexdb-schema = { path = "../plexdb-schema" }
plexdb-store = { path = "../plexdb-store" }
base64 = "0.23"
# The Title map and Tag network layout (plex-db-ex-f58.21 picked it); `layout.rs` says why.
holomap = "=0.3.0"
libc = "0.2"
# `hooks` and `limits`: `record-panels` runs a panel's SQL under an authorizer, a progress
# deadline and a value-length limit, the way the Query tab does.
rusqlite = { workspace = true, features = ["hooks", "limits"] }
# `preserve_order`: a list's JSON keeps the key order `plexdb lists --json` prints it in.
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = "0.10"
# `frame_vec` is a vec0 virtual table (ADR-0024): the harvester writes it, so the
# extension loads in this crate too, at the version the workspace pins.
sqlite-vec = { workspace = true }
tempfile = "3"
thiserror = { workspace = true }
# The list harvests' HTTP calls to MDBList and Letterboxd, both https. Only this crate
# turns TLS on; the reader stays plain http (ADR-0026).
ureq = { workspace = true, features = ["rustls"] }

# Named `plexdb-rs` while the Python package still owns `plexdb` on PATH; the
# last slice of the move renames it.
[[bin]]
name = "plexdb-rs"
path = "src/main.rs"

[lib]
name = "plexdb"
path = "src/lib.rs"
