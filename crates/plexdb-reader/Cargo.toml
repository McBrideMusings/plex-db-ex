[package]
name = "plexdb-reader"
version = "0.1.0"
edition = "2024"
description = "Read-only typed access to a plexdb.db store (ADR-0003)."

[dependencies]
# `limits` on top of the workspace default: `enrichment_for_many` reads this
# connection's own `SQLITE_LIMIT_VARIABLE_NUMBER` to chunk an `IN` clause
# rather than assuming a candidate set never exceeds it.
rusqlite = { workspace = true, features = ["limits"] }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lib]
name = "plexdb_reader"
path = "src/lib.rs"
