[package]
name = "plexdb-reader"
version = "0.1.0"
edition = "2024"
description = "Read-only typed access to a plexdb.db store (ADR-0003)."

[dependencies]
# `limits` on top of the workspace default: `enrichment_for_many` reads this
# connection's own `SQLITE_LIMIT_VARIABLE_NUMBER` to chunk an `IN` clause
# rather than assuming a candidate set never exceeds it.
rusqlite = { workspace = true, features = ["limits"] }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# `frame_vec` is a vec0 virtual table (ADR-0024); reading it needs the extension
# loaded, at the version the writer's `sqlite-vec` pin names.
sqlite-vec = { workspace = true }
# The Phrase cache's one HTTP call (ADR-0026). No TLS feature: the encoder is a
# plain-http endpoint on the writer's network.
ureq = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# The writer's schema chain: the tests build their stores with it, and pin
# `SUPPORTED_READER_SHAPE` to the shape it stamps. A dev-dependency only, so the
# library a consumer vendors carries no second crate.
plexdb-schema = { path = "../plexdb-schema" }
tempfile = "3"

[[bin]]
name = "plexdb-read"
path = "src/bin/plexdb-read.rs"

[lib]
name = "plexdb_reader"
path = "src/lib.rs"
